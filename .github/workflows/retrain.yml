name: Retrain & Validate Model

# Triggers:
#   - Every push to main (automatic retraining on code changes)
#   - Manual trigger from the Actions tab (for on-demand runs)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  retrain:
    name: Run CML training pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pipeline dependencies
        run: pip install requests

      - name: Run CML pipeline (generate → train → validate)
        env:
          CML_WORKSPACE_URL: ${{ secrets.CML_WORKSPACE_URL }}
          CML_API_KEY:       ${{ secrets.CML_API_KEY }}
          CML_PROJECT_ID:    ${{ secrets.CML_PROJECT_ID }}
        run: python cml_pipeline.py
