name: Retrain & Validate Model

# Triggers:
#   - Every push to main
#   - Manual trigger from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  retrain:
    name: Train and validate model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate loan data
        run: python 01_generate_data.py

      - name: Train model
        run: python 02_train_model.py

      - name: Validate model KPIs
        run: python 05_validate_model.py
